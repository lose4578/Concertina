# LIBERO, 4 suites x 10 tasks x 50 episodes (init states 0..49, seeds from 1000), 360x360 cameras.
# Runs in-process in an environment with LeRobot's `libero` extra (hf-libero); every episode is recorded.
#
#   MUJOCO_GL=egl python -m concertina.eval.libero --config_path configs/eval/libero.yaml \
#       --policy_path <policy dir> --output_dir <run dir>
env:
  type: libero
  task: libero_spatial,libero_object,libero_goal,libero_10
  observation_height: 360
  observation_width: 360
  camera_name: agentview_image,robot0_eye_in_hand_image
  # LIBERO cameras -> observation.images.image / image2, the keys of the LIBERO LeRobot datasets.
  camera_name_mapping: null
  init_states: true
  control_mode: relative
n_episodes: 50
batch_size: 1
use_async_envs: false
seed: 1000
device: cuda
max_episodes_rendered: -1
allow_tf32: true
# Decoding recipe of the reported LIBERO (and CALVIN) results.
inference:
  n_action_steps: 10
  draft_steps: 4
  confidence: token_risk
  commit_strategy: dynamic
  commit_confidence_threshold: 0.0
  commit_max_ratio: 0.5
  draft_ranking: confidence
  draft_seed: null
  visible_revision: false
  revision_margin: 0.0
  remask_steps: 5
  remask_ratio: 0.15
  remask_cooldown_steps: 0
  remask_decay_budget: false
  remask_accept_if_improved: false
  remask_improvement_margin: 0.0
  remask_early_stop_patience: 2
  remask_keep_best: false
  remask_no_repeat: false
  remask_keep_draft_translation: false
  rtc: false
  rtc_prefix_source: executed_tail
  rtc_execution_horizon: 0
