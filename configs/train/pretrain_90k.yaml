# Concertina pretraining, stage 2 -> Traly/concertina-pretrain-90k: 30,000 more updates from the stage-1
# checkpoint of pretrain_60k.yaml (not released) on the same 39 datasets; 8 processes x batch_size 192 = 1536
# samples per update. The benchmark fine-tunes start from it.
# The pretraining datasets are not released; policy.data.datasets[i].path are directories under dataset.root.
# policy.pretrained_path is a placeholder: pass the pretrained_model directory written by pretrain_60k.yaml.
#   torchrun --nproc-per-node=8 "$(which concertina-train)" --config_path=configs/train/pretrain_90k.yaml \
#       --dataset.root=/path/to/datasets \
#       --policy.pretrained_path=<pretrain_60k output_dir>/checkpoints/last/pretrained_model
# Fewer GPUs: k-fold accelerator.gradient_accumulation.steps keeps the batch; also multiply steps, save_freq
# and policy.scheduler_{warmup,decay}_steps by k (all count micro-batches).
# Do not pass --policy.path (it replaces the policy section of this file).
dataset:
  repo_id: concertina/pretrain-90k
  root: /path/to/datasets
  image_transforms:
    enable: true
    max_num_transforms: 3
    random_order: false
    tfs:
      affine:
        weight: 1.0
        type: RandomAffine
        kwargs:
          degrees:
          - -5
          - 5
          translate:
          - 0.05
          - 0.05
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness:
          - 0.8
          - 1.2
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast:
          - 0.8
          - 1.2
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue:
          - -0.05
          - 0.05
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation:
          - 0.5
          - 1.5
      sharpness:
        weight: 1.0
        type: SharpnessJitter
        kwargs:
          sharpness:
          - 0.5
          - 1.5
  use_imagenet_stats: true
  video_backend: torchcodec
policy:
  type: concertina
  device: cuda
  dtype: float32
  push_to_hub: false
  pretrained_path: /path/to/pretrain_60k/checkpoints/last/pretrained_model
  model:
    backbone_path: ''
    vision_attn_implementation: sdpa
    training_attn_implementation: cudnn_sdpa_native_gqa
    gradient_checkpointing: true
    use_liger_kernels: true
    camera_keys:
    - observation.images.head
    - observation.images.wrist_left
    - observation.images.wrist_right
    chunk_size: 20
    block_size: 10
    gripper_indices:
    - 9
    - 19
    gripper_target: probability
    action_dim_loss_weights:
    - 500.0
    - 500.0
    - 500.0
    - 10.0
    - 10.0
    - 10.0
    - 10.0
    - 10.0
    - 10.0
    - 1.0
    - 500.0
    - 500.0
    - 500.0
    - 10.0
    - 10.0
    - 10.0
    - 10.0
    - 10.0
    - 10.0
    - 1.0
    state_mask_dims:
    - 2
    - 12
    state_mask_prob: 0.5
    state_mask_ratio_range:
    - 1.0
    - 1.0
    state_mask_fill_value: 0.0
    random_resized_crop: true
    mask_value: zeros
    corruption:
      mode: log_linear_mask
      visible_corruption: uniform
      visible_noise_std: 1.0
      visible_uniform_range:
      - -1.0
      - 1.0
      probability_floor: 0.001
      loss_weighting: none
    full_mask_probability: 0.0
    visible_action_context:
      strategy: none
      apply_probability: 0.0
      noise_std:
      - 0.0
      repair_loss_weight: 0.0
      apply_to_history: false
    token_risk: true
    action_history:
      enabled: false
      horizon: 20
      mode: prefix
      missing_history: mask
      noise_std: 1.0
    freeze_action_heads: false
    freeze_backbone_layers: []
    rng_seed: 43
    inference:
      n_action_steps: 20
      draft_steps: 4
      confidence: token_risk
      commit_strategy: dynamic
      commit_confidence_threshold: 0.0
      commit_max_ratio: 0.5
      draft_ranking: confidence
      draft_seed: null
      visible_revision: true
      revision_margin: 0.0
      remask_steps: 2
      remask_ratio: 0.2
      remask_cooldown_steps: 1
      remask_decay_budget: true
      remask_accept_if_improved: true
      remask_improvement_margin: 0.0
      remask_early_stop_patience: 2
      remask_keep_best: true
      remask_no_repeat: false
      remask_keep_draft_translation: false
      rtc: false
      rtc_prefix_source: executed_tail
      rtc_execution_horizon: 0
  data:
    datasets:
    - path: droid
      source: droid
      embodiment: droid_single
      adapter: null
      weight: 0.15
      source_fps: 15.0
      camera_map:
        observation.images.head:
        - observation.images.exterior_1_left
        observation.images.wrist_left:
        - observation.images.wrist_left
      valid_action_dim: 10
      gripper_profile: droid
      rotation_stats_path: null
      episodes: null
      quality_package: null
    - path: droid
      source: droid
      embodiment: droid_single
