[build-system]
requires = ["setuptools>=77.0.0,<82.0.0"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is load-bearing: lerobot's `register_third_party_plugins` imports every
# installed distribution whose metadata Name starts with `lerobot_policy_`, using that name as the module.
name = "lerobot_policy_concertina"
version = "0.1.0"
description = "Concertina, an embodied vision-language model (eVLM), as a LeRobot policy plugin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "The Concertina Authors" }]
requires-python = ">=3.12"
dependencies = [
    "lerobot[training,transformers-dep,scipy-dep] @ git+https://github.com/huggingface/lerobot@2b8aeee410753fcfaa44ec259707474bf6141b62",
]

[project.optional-dependencies]
liger = ["liger-kernel>=0.8.0,<0.9.0; sys_platform == 'linux'"]
test = ["pytest>=8.1.0,<10.0.0", "pytest-timeout>=2.4.0,<3.0.0"]
# LIBERO simulation for `concertina-eval-libero` (LeRobot's `libero` extra: hf-libero, robosuite, MuJoCo).
libero = [
    "lerobot[libero] @ git+https://github.com/huggingface/lerobot@2b8aeee410753fcfaa44ec259707474bf6141b62",
]
dev = ["lerobot_policy_concertina[test]", "ruff>=0.14.1"]

[project.scripts]
concertina-train = "concertina.train.entry:main"
concertina-compute-rotation-stats = "concertina.data.tools.rotation_stats:main"
concertina-normalize-episode-metadata = "concertina.data.tools.episode_metadata:main"
concertina-data-quality = "concertina.data_quality.cli:main"
concertina-eval = "concertina.eval.runner:main"
concertina-eval-server = "concertina.eval.server:main"
concertina-eval-libero = "concertina.eval.libero:main"
concertina-convert-calvin = "concertina.data.tools.convert_calvin:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["concertina*", "concertina_eval_client*", "lerobot_policy_concertina*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM"]
ignore = [
    "E501", # Line too long
    "T201", # Print statement found
    "T203", # Pprint statement found
    "B008", # Perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["concertina", "concertina_eval_client", "lerobot_policy_concertina"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "gpu: requires a CUDA device",
]
